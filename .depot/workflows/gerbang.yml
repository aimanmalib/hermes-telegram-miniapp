# Same gate as .github/workflows/ci.yml, run on Depot CI (dispatched by ~/bin/gerbang-depot.sh on the owner's
# server) so it does not depend on GitHub Actions minutes for private repos. workflow_dispatch only: no double runs.
name: gerbang
on: workflow_dispatch
permissions:
  contents: read
jobs:
  plugin:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
  web:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:no-demo
      - run: npm run build:demo
      - run: npm audit --omit=dev --audit-level=high
