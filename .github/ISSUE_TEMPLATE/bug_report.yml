name: Bug report
description: Something in the Mini App or the plugin doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: hermes
    attributes:
      label: Hermes Agent version (`hermes --version`)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Telegram app (iOS), Telegram app (Android), Telegram Desktop, Telegram Web, Plugin / server side]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Dashboard log lines (remove tokens, chat IDs and initData first)
      render: text
