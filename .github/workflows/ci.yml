name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  web:
    name: Web typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production bundle contains no demo code
        run: npm run check:no-demo
      - run: npm run build:demo
      - name: No known high/critical vulnerabilities in runtime deps
        run: npm audit --omit=dev --audit-level=high

  # Tag list comes from compat/hermes-versions.json: testing a new Hermes release = one line there, no workflow edit.
  hermes-versions:
    name: Hermes versions under test
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.v.outputs.tags }}
      python: ${{ steps.v.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          d = json.load(open("compat/hermes-versions.json"))
          print("tags=" + json.dumps(d["uji"]))
          print("python=" + d["python"])
          PY

  hermes-contract:
    name: Contract tests (Hermes ${{ matrix.hermes }})
    needs: hermes-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hermes: ${{ fromJSON(needs.hermes-versions.outputs.tags) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.hermes-versions.outputs.python }}
      - run: python -m pip install uv==0.12.5
      - name: Install Hermes ${{ matrix.hermes }} from its release tag (locked dependencies)
        env:
          HERMES_TAG: ${{ matrix.hermes }}
        run: |
          git clone --depth 1 --branch "$HERMES_TAG" https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"
          cd "$RUNNER_TEMP/hermes-agent" && uv sync --frozen --no-dev --python "$(command -v python)"
      - run: uv pip install --python "$RUNNER_TEMP/hermes-agent/.venv/bin/python" -r tests/contract/requirements.txt
      - name: Contract tests against Hermes ${{ matrix.hermes }}
        env:
          HERMES_CONTRACT_REQUIRED: "1"
          HERMES_EXPECT_VERSION: ${{ matrix.hermes }}
        run: '"$RUNNER_TEMP/hermes-agent/.venv/bin/python" -m pytest tests/contract -o addopts= -q -rs'
