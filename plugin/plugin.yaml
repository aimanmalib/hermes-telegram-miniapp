name: telegram-app
version: 0.7.0
manifest_version: 2
description: >-
  Telegram Mini App control panel for Hermes Agent: live status, sessions, cron, logs and alerts on your phone,
  behind verified Telegram login (initData HMAC, Ed25519 fallback) and a plugin-owned admin list that refuses
  everyone until TELEGRAM_OWNER_ID (or the admins setting) is set; being allowed to chat with the bot never grants it. The backend is the dashboard plugin in dashboard/; the phone
  app in the repository's web/ folder is built and served separately.
author: Muhammad Aiman (aimanmalib), Sasa Teguh
license: MIT
homepage: https://github.com/aimanmalib/hermes-telegram-miniapp
tags: [telegram, dashboard, mobile]
requires_hermes: ">=0.23.0"
requires_env:
  - name: TELEGRAM_BOT_TOKEN
    description: "Token of the Telegram bot that opens the Mini App (the same bot Hermes uses for Telegram)"
    url: "https://core.telegram.org/bots#how-do-i-create-a-bot"
    secret: true
config_schema:
  admins:
    type: list
    default: []
    description: "Extra Telegram user ids allowed to log in to the Mini App and receive alerts, besides TELEGRAM_OWNER_ID"
  alerts_enabled:
    type: bool
    default: true
    description: "Start the alerts watcher that DMs the first admin about cron failures, error-log bursts and daily spend"
  ask_max_chars:
    type: int
    default: 2000
    description: "Longest question the Ask tab accepts (1-20000 characters)"
  ask_max_pending:
    type: int
    default: 1
    description: "How many Ask questions may wait or run at once (1-10); a further one is refused until one finishes"
