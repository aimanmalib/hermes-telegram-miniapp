<!doctype html>
<!-- A plain chat screen for the demo video, labelled "Mock" the whole time.
     record.py serves it from the dev server's origin and fills in window.MOCK from storyboard.json.
     Tapping the menu button slides up a sheet that loads the real Mini App (same origin, iframe).
     record.py may also close the sheet, add a message (a delivered reply, MarkdownV2 as Hermes sent it)
     and show a small "time skipped" chip over a jump cut. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat (mock)</title>
<style>
  :root { --bg: #0e1621; --head: #17212b; --in: #182533; --out: #2b5278; --text: #f5f5f5; --muted: #7f91a4; --accent: #5eb5f7; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, "Segoe UI", Roboto, "Liberation Sans", Arial, sans-serif; overflow: hidden; }
  .head { position: fixed; inset: 0 0 auto 0; height: 64px; display: flex; align-items: center; gap: 12px;
    padding: 0 16px; background: var(--head); border-bottom: 1px solid #0b1118; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #6c8cff, #3a5bd9); font-weight: 700; }
  .who b { display: block; font-size: 17px; }
  .who span { color: var(--muted); font-size: 14px; }
  .feed { position: absolute; inset: 64px 0 64px 0; display: flex; flex-direction: column; justify-content: flex-end;
    gap: 8px; padding: 12px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 16px; font-size: 16px; }
  .msg.bot { align-self: flex-start; background: var(--in); border-bottom-left-radius: 6px; }
  .msg.me { align-self: flex-end; background: var(--out); border-bottom-right-radius: 6px; }
  .bar { position: fixed; inset: auto 0 0 0; height: 64px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: var(--head); }
  .menu { border: 0; border-radius: 10px; padding: 9px 14px; background: var(--accent); color: #fff;
    font: 600 15px/1 inherit; font-family: inherit; }
  .input { flex: 1; color: var(--muted); font-size: 16px; }
  .sheet { position: fixed; inset: 0; background: var(--bg); transform: translateY(100%);
    transition: transform 420ms cubic-bezier(.2, .8, .2, 1); border-radius: 14px 14px 0 0; overflow: hidden; }
  .sheet.open { transform: translateY(0); }
  .msg b { font-weight: 700; }
  .msg.long { max-width: 88%; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .chip { position: fixed; top: 42%; left: 50%; transform: translateX(-50%); z-index: 10; padding: 8px 16px;
    border-radius: 999px; background: #17212b; color: var(--text); border: 1px solid #2b3a4a; font: 700 16px/1.2 inherit;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .5);
    font-family: inherit; opacity: 0; transition: opacity 200ms ease-out; }
  .chip.on { opacity: 1; }
  .sheet iframe { width: 100%; height: 100%; border: 0; display: block; }
  .mock { position: fixed; top: 76px; right: 12px; z-index: 10; padding: 4px 10px; border-radius: 999px;
    background: #f5c518; color: #1a1a1a; font: 700 13px/1.2 inherit; font-family: inherit; letter-spacing: .04em;
    text-transform: uppercase; box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
</style>
</head>
<body>
  <div class="head">
    <div class="avatar" id="avatar"></div>
    <div class="who"><b id="bot"></b><span>bot</span></div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="bar">
    <button class="menu" id="menu" type="button"></button>
    <div class="input">Message</div>
  </div>
  <div class="sheet" id="sheet"></div>
  <div class="mock" id="mock"></div>
  <div class="chip" id="chip"></div>
<script>
  const m = window.MOCK;
  document.getElementById("bot").textContent = m.bot;
  document.getElementById("avatar").textContent = m.bot.slice(0, 1);
  document.getElementById("menu").textContent = m.menu_button;
  document.getElementById("mock").textContent = m.label;
  const feed = document.getElementById("feed");
  const sheet = document.getElementById("sheet");
  // Telegram MarkdownV2 as sent: \x escapes, *bold*, _italic_. Text is escaped before any tag is added.
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function mdv2(text) {
    const parts = text.split(/(\\.)/s);
    let out = "";
    for (const part of parts) out += part.startsWith("\\") && part.length === 2 ? "\u0000" + part[1].charCodeAt(0) + "\u0001" : part;
    out = esc(out).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/_([^_\n]+)_/g, "<i>$1</i>");
    return out.replace(/\u0000(\d+)\u0001/g, (_, c) => esc(String.fromCharCode(Number(c))));
  }
  window.addMessage = (from, text, markdown) => {
    const d = document.createElement("div");
    d.className = "msg " + (from === "me" ? "me" : "bot") + (markdown ? " long" : "");
    if (markdown) d.innerHTML = mdv2(text); else d.textContent = text;
    feed.appendChild(d);
  };
  for (const msg of m.messages) window.addMessage(msg.from, msg.text, false);
  window.closeSheet = () => sheet.classList.remove("open");
  window.showChip = (text) => {
    const chip = document.getElementById("chip");
    chip.textContent = text;
    chip.classList.add("on");
  };
  window.hideChip = () => document.getElementById("chip").classList.remove("on");
  document.getElementById("menu").addEventListener("click", () => {
    const frame = document.createElement("iframe");
    frame.src = m.app_url;
    frame.title = "Mini App";
    sheet.appendChild(frame);
    requestAnimationFrame(() => sheet.classList.add("open"));
  });
</script>
</body>
</html>
